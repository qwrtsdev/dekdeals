# Builds the site on every push and pull request. The content schema fails the build on a bad
# deal file (including unknown category, broken includedIn slug, etc.)

name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
